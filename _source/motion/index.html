<!doctype html>
<html
  lang="ru"
  data-resolution="portrait"
  data-composition-variables='[{"id":"background","type":"boolean","label":"Графитовый фон (выкл — прозрачный)","default":true}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: #111315;
      }
    </style>
  </head>
  <body>
    <!-- Интро 0–1.8 с и аутро 1.8–5.0 с рендерятся одним файлом и режутся на два: python export.py -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="1.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="1.8"
        data-duration="3.2"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <audio id="sfx-click" class="clip" src="assets/sfx/click.mp3" data-start="0.26" data-duration="0.4" data-track-index="3" data-volume="1.4"></audio>
      <audio id="sfx-pop" class="clip" src="assets/sfx/pop.mp3" data-start="1.963" data-duration="0.7" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      if (vars.background === false) document.getElementById("bg").style.opacity = "0";
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>

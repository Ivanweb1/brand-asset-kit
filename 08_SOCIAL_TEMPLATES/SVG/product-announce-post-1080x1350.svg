<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><title>Анонс продукта</title><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#111315"/><g transform="translate(88 96) scale(0.164103)"><g fill="#F5F4F0" fill-rule="evenodd"><path d="M42 0H138A42 42 0 0 1 180 42V138A42 42 0 0 1 138 180H42A42 42 0 0 1 0 138V42A42 42 0 0 1 42 0ZM54 38A16 16 0 0 0 38 54V126A16 16 0 0 0 54 142H126A16 16 0 0 0 142 126V54A16 16 0 0 0 126 38Z"/><path d="M252 0H348A42 42 0 0 1 390 42V138A42 42 0 0 1 348 180H252A42 42 0 0 1 210 138V42A42 42 0 0 1 252 0ZM264 38A16 16 0 0 0 248 54V126A16 16 0 0 0 264 142H336A16 16 0 0 0 352 126V54A16 16 0 0 0 336 38Z"/><path d="M42 210H138A42 42 0 0 1 180 252V348A42 42 0 0 1 138 390H42A42 42 0 0 1 0 348V252A42 42 0 0 1 42 210ZM54 248A16 16 0 0 0 38 264V336A16 16 0 0 0 54 352H126A16 16 0 0 0 142 336V264A16 16 0 0 0 126 248Z"/></g><g fill="#F5F4F0"><rect x="340" y="210" width="50" height="50" rx="12"/><rect x="275" y="275" width="50" height="50" rx="12"/><rect x="210" y="340" width="50" height="50" rx="12"/><rect x="340" y="340" width="50" height="50" rx="12"/></g><rect x="210" y="210" width="50" height="50" rx="12" fill="#1769FF"/></g><text x="88.00" y="335.20" font-family="Manrope" font-size="110" font-weight="700" fill="#F5F4F0" letter-spacing="-3.85">Аудит</text><text x="88.00" y="451.80" font-family="Manrope" font-size="110" font-weight="700" fill="#F5F4F0" letter-spacing="-3.85">процессов</text><rect x="88" y="474.9" width="498.96" height="119.9" rx="22" fill="#1769FF"/><text x="105.60" y="568.40" font-family="Manrope" font-size="110" font-weight="700" fill="#F5F4F0" letter-spacing="-3.85">за 7 дней</text><text x="88.00" y="664.32" font-family="Manrope" font-size="36" font-weight="500" fill="#9A9EA4">Находим, где команда теряет время, и даём план</text><text x="88.00" y="715.44" font-family="Manrope" font-size="36" font-weight="500" fill="#9A9EA4">автоматизации с расчётом эффекта</text><rect x="88" y="785.44" width="904" height="115.52" rx="28" fill="#1B1E21"/><rect x="106" y="799.2" width="88" height="88" rx="21.12" fill="#111315"/><text x="131.06" y="855.87" font-family="Manrope" font-size="35.2" font-weight="700" fill="#F5F4F0" letter-spacing="-0.70">01</text><text x="220.00" y="837.20" font-family="Manrope" font-size="38" font-weight="700" fill="#F5F4F0">Карта процессов</text><text x="220.00" y="879.20" font-family="Manrope" font-size="28" font-weight="500" fill="#9A9EA4">Как работа идёт сейчас</text><rect x="88" y="916.96" width="904" height="115.52" rx="28" fill="#1B1E21"/><rect x="106" y="930.72" width="88" height="88" rx="21.12" fill="#111315"/><text x="128.29" y="987.39" font-family="Manrope" font-size="35.2" font-weight="700" fill="#F5F4F0" letter-spacing="-0.70">02</text><text x="220.00" y="968.72" font-family="Manrope" font-size="38" font-weight="700" fill="#F5F4F0">Расчёт экономии</text><text x="220.00" y="1010.72" font-family="Manrope" font-size="28" font-weight="500" fill="#9A9EA4">Часы и деньги в месяц</text><rect x="88" y="1048.48" width="904" height="115.52" rx="28" fill="#1B1E21"/><rect x="106" y="1062.24" width="88" height="88" rx="21.12" fill="#1769FF"/><text x="128.54" y="1118.91" font-family="Manrope" font-size="35.2" font-weight="700" fill="#F5F4F0" letter-spacing="-0.70">03</text><text x="220.00" y="1100.24" font-family="Manrope" font-size="38" font-weight="700" fill="#F5F4F0">План внедрения</text><text x="220.00" y="1142.24" font-family="Manrope" font-size="28" font-weight="500" fill="#9A9EA4">Что, в каком порядке, чем</text><text x="88.00" y="1254.00" font-family="Manrope" font-size="28" font-weight="600" fill="#9A9EA4">@username</text><rect x="909.25" y="1203.17" width="81.5" height="81.5" rx="21.84" fill="none" stroke="#F5F4F0" stroke-width="2.5"/><line x1="937" y1="1243.92" x2="963" y2="1243.92" stroke="#F5F4F0" stroke-width="3" stroke-linecap="round"/><path d="M956 1236.92L963 1243.92L956 1250.92" fill="none" stroke="#F5F4F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
